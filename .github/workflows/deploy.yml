name: Deploy to Vercel

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Static identifiers; the org ID is resolved at runtime from the
      # Vercel API because hard-coding it makes the workflow brittle.
      VERCEL_PROJECT_ID: prj_cN3FkhM8AWqw7GhVgyhINKUyf66J
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        # Pinned to the last release that was `latest` while this workflow
        # was deploying successfully (commit dd3d1c5, 2026-05-21).
        # Bumping the CLI without testing is the most common cause of
        # silent breakage here, so do not change this without checking.
        run: npm install -g vercel@54.2.0

      - name: Verify token and resolve org ID
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          # Sanity check: token must authenticate against the Vercel API.
          WHOAMI_HTTP=$(curl -sS -o /tmp/whoami.json -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v2/user")
          echo "whoami HTTP $WHOAMI_HTTP"
          if [ "$WHOAMI_HTTP" != "200" ]; then
            echo "Token rejected by Vercel API. Body:"
            cat /tmp/whoami.json
            exit 1
          fi
          # Resolve the project's accountId, which is the orgId the CLI needs.
          PROJECT_HTTP=$(curl -sS -o /tmp/project.json -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}")
          echo "project lookup HTTP $PROJECT_HTTP"
          if [ "$PROJECT_HTTP" != "200" ]; then
            echo "Project lookup failed. Body:"
            cat /tmp/project.json
            exit 1
          fi
          ORG_ID=$(node -e 'process.stdout.write(require("/tmp/project.json").accountId || "")')
          if [ -z "$ORG_ID" ]; then
            echo "ERROR: accountId not present in project response"
            cat /tmp/project.json
            exit 1
          fi
          echo "Resolved VERCEL_ORG_ID (length=${#ORG_ID})"
          # Export for subsequent steps. Setting both env vars is the
          # officially supported way to drive `vercel pull/build/deploy`
          # in a non-interactive CI environment.
          echo "VERCEL_ORG_ID=$ORG_ID" >> "$GITHUB_ENV"

      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        # IMPORTANT: run from the repo ROOT, not ./claim. The Vercel
        # project's "Root Directory" is set to `claim/` in the dashboard,
        # so the CLI appends `claim/` to the current working directory.
        # If we cd into ./claim first, the CLI looks for ./claim/claim
        # and dies with:
        #   Error: The provided path ".../claim/claim" does not exist.
        run: |
          set -e
          # Belt-and-braces: also write a full project.json with the
          # resolved orgId. The Vercel CLI accepts this as a fallback
          # when the VERCEL_ORG_ID / VERCEL_PROJECT_ID env vars are
          # absent.
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' \
            "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          echo "project.json written:"
          node -e 'const p=require("./.vercel/project.json"); console.log({projectId:p.projectId,orgIdLen:p.orgId.length})'

          # `vercel pull` overwrites .vercel/project.json with the full
          # project settings (framework, node version, env, etc.) which
          # `vercel build --prebuilt` requires. If pull fails the build
          # will fail with a confusing "project_settings_required" error,
          # so surface pull failures explicitly with --debug output.
          echo "::group::vercel pull"
          if ! vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --debug; then
            echo "::error::vercel pull failed. The token likely lacks access to project ${VERCEL_PROJECT_ID} in org ${VERCEL_ORG_ID:0:8}... (token scope mismatch is the usual cause). Rotate VERCEL_TOKEN to one created from this team's settings page."
            exit 1
          fi
          echo "::endgroup::"

          # Verify pull actually populated project settings — if the file
          # has no `settings` key, `vercel build` will fail with a vague
          # `project_settings_required` error.
          if ! node -e 'const p=require("./.vercel/project.json"); if(!p.settings){process.exit(2)}'; then
            echo "::error::vercel pull did not populate .vercel/project.json with settings; aborting before build."
            cat .vercel/project.json || true
            exit 1
          fi

          echo "::group::vercel build"
          vercel build --prod --token="$VERCEL_TOKEN"
          echo "::endgroup::"

          echo "::group::vercel deploy"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          echo "::endgroup::"
