name: Deploy to Vercel

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Resolve Vercel org/project IDs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          PROJECT_ID="prj_cN3FkhM8AWqw7GhVgyhINKUyf66J"
          # whoami (sanity-check token)
          curl -sS -o /tmp/whoami.json -w "whoami HTTP %{http_code}\n" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v2/user"
          cat /tmp/whoami.json; echo
          # Look up the project to get its accountId (== orgId)
          curl -sS -o /tmp/project.json -w "project HTTP %{http_code}\n" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/${PROJECT_ID}"
          cat /tmp/project.json; echo
          ORG_ID=$(node -e "const p=require('/tmp/project.json'); process.stdout.write(p.accountId||'')")
          if [ -z "$ORG_ID" ]; then
            echo "ERROR: could not resolve Vercel org ID"
            exit 1
          fi
          echo "Resolved ORG_ID=$ORG_ID"
          echo "VERCEL_ORG_ID=$ORG_ID" >> "$GITHUB_ENV"
          echo "VERCEL_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
        working-directory: ./claim
        run: |
          set -e
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
