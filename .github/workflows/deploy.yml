name: Deploy to Vercel

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Verify token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -x
          RESP=$(curl -s -o /tmp/whoami.json -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v2/user")
          echo "HTTP status: $RESP"
          cat /tmp/whoami.json

      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -x
          mkdir -p claim/.vercel
          echo '{"projectId":"prj_cN3FkhM8AWqw7GhVgyhINKUyf66J","orgId":""}' > claim/.vercel/project.json
          cd claim
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" 2>&1 || true
          vercel build --prod --token="$VERCEL_TOKEN" 2>&1
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" 2>&1
